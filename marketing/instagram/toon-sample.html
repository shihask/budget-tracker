<!doctype html>
<html lang="ml">
<head>
<meta charset="utf-8">
<title>MoneyPlant toon sample: Manu's salary day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Noto+Sans+Malayalam:wght@700;800&display=swap" rel="stylesheet">
<!-- Sample scene for a character-led reel series. Flat-vector characters drawn in SVG and
     animated from render(t) (reel-kit), so render-reel.mjs can turn it into a video.
     Original characters and setting: Manu (young salaried) and Vasu-maaman at a tea stall. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; font-family: 'Plus Jakarta Sans', 'Noto Sans Malayalam', sans-serif; }
  #stage { position: absolute; inset: 0; }
  .badge { position: absolute; left: 70px; top: 250px; display: flex; gap: 16px; align-items: center; }
  .handle { background: rgba(255,255,255,.92); color: #0A7A56; font-weight: 800; font-size: 34px; padding: 14px 28px; border-radius: 999px; display: flex; gap: 14px; align-items: center; }
  .handle img { width: 48px; height: 48px; border-radius: 12px; }
  .ep { background: #F2B52C; color: #3b2a00; font-weight: 800; font-size: 32px; padding: 14px 26px; border-radius: 999px; }
  .title { position: absolute; left: 70px; top: 360px; background: #0A7A56; color: #fff; font-weight: 800; font-size: 76px; padding: 18px 40px; border-radius: 30px; box-shadow: 0 14px 0 #075c41; }
  .bubble { position: absolute; background: #fff; border-radius: 40px; padding: 26px 34px; font-size: 46px; font-weight: 800; color: #1C1410; box-shadow: 0 10px 30px rgba(0,0,0,.18); transform-origin: bottom left; }
  .bubble::after { content: ''; position: absolute; bottom: -26px; left: 60px; border: 18px solid transparent; border-top: 26px solid #fff; }
  .notif { position: absolute; left: 110px; right: 110px; top: 560px; background: #fff; border-radius: 34px; padding: 26px 30px; display: flex; gap: 22px; align-items: center; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .notif .ic { width: 84px; height: 84px; border-radius: 22px; background: #E3F8EF; display: grid; place-items: center; font-size: 44px; font-weight: 800; color: #0A7A56; }
  .notif b { display: block; font-size: 30px; color: #6B5F57; }
  .notif span { font-size: 50px; font-weight: 800; color: #1C1410; letter-spacing: -1px; }
  .sub { position: absolute; left: 60px; right: 60px; bottom: 110px; text-align: center; font-size: 70px; font-weight: 800; color: #FFE066; -webkit-text-stroke: 3px #2b1d00; paint-order: stroke fill; text-shadow: 0 6px 0 #2b1d00; }
</style>
</head>
<body>
<div id="stage">
<svg viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FD3F4"/><stop offset="1" stop-color="#D7F0E3"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C98B52"/><stop offset="1" stop-color="#A86C3A"/></linearGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#sky)"/>
  <!-- far hills -->
  <path d="M0 1000 Q 200 880 420 960 T 820 930 T 1080 960 V 1200 H0Z" fill="#7CC59A"/>
  <path d="M0 1080 Q 260 980 520 1050 T 1080 1040 V 1250 H0Z" fill="#5DAF7F"/>
  <!-- palms -->
  <g id="palmL">
    <path d="M150 1300 C 140 1150 170 1010 205 900" stroke="#8A5A33" stroke-width="26" fill="none" stroke-linecap="round"/>
    <g fill="#2F9E5B"><path d="M205 900 q -120 -30 -190 40 q 110 -10 190 -40"/><path d="M205 900 q 110 -60 210 0 q -110 -20 -210 0"/><path d="M205 900 q -40 -110 -150 -130 q 70 60 150 130"/><path d="M205 900 q 60 -120 170 -120 q -90 50 -170 120"/><path d="M205 900 q -10 120 -110 170 q 50 -90 110 -170"/></g>
  </g>
  <g transform="translate(830 -40) scale(.9)">
    <path d="M150 1300 C 140 1150 170 1010 205 900" stroke="#8A5A33" stroke-width="26" fill="none" stroke-linecap="round"/>
    <g fill="#2F9E5B"><path d="M205 900 q -120 -30 -190 40 q 110 -10 190 -40"/><path d="M205 900 q 110 -60 210 0 q -110 -20 -210 0"/><path d="M205 900 q -40 -110 -150 -130 q 70 60 150 130"/><path d="M205 900 q 60 -120 170 -120 q -90 50 -170 120"/></g>
  </g>
  <!-- ground -->
  <rect y="1250" width="1080" height="670" fill="url(#ground)"/>
  <!-- tea stall -->
  <g transform="translate(330 860)">
    <path d="M-40 120 L 220 30 L 480 120 Z" fill="#7A8B99"/><path d="M-40 120 L 480 120 L 470 140 L -30 140Z" fill="#5E6C78"/>
    <rect x="0" y="140" width="440" height="300" fill="#C7894F"/>
    <rect x="30" y="180" width="380" height="150" fill="#3B2A1E"/>
    <rect x="-10" y="330" width="460" height="40" fill="#8F5E33"/>
    <rect x="60" y="230" width="60" height="100" rx="8" fill="#B9C2C8"/><rect x="70" y="210" width="40" height="24" rx="6" fill="#9AA4AB"/>
    <circle cx="200" cy="300" r="20" fill="#E8B04A"/><circle cx="240" cy="300" r="20" fill="#E8B04A"/>
    <rect x="300" y="250" width="70" height="80" rx="10" fill="#E9E2D0" opacity=".9"/>
    <rect x="90" y="40" width="260" height="70" rx="10" fill="#8F5E33"/>
    <text x="220" y="88" text-anchor="middle" font-family="Noto Sans Malayalam" font-weight="800" font-size="38" fill="#FFE9C2">ചായക്കട</text>
  </g>

  <!-- Vasu-maaman (older, white shirt, mundu, moustache) -->
  <g id="vasu" transform="translate(250 1180)">
    <ellipse cx="0" cy="560" rx="120" ry="18" fill="rgba(0,0,0,.18)"/>
    <rect x="-70" y="330" width="140" height="230" rx="20" fill="#F7F3EA"/><path d="M-70 520 h140" stroke="#D8C9A0" stroke-width="10"/>
    <rect x="-46" y="545" width="34" height="18" rx="8" fill="#5A3B26"/><rect x="12" y="545" width="34" height="18" rx="8" fill="#5A3B26"/>
    <rect x="-90" y="150" width="180" height="200" rx="50" fill="#FFFFFF"/>
    <path d="M-30 150 L 0 200 L 30 150" fill="#EDE5D6"/>
    <g id="vasuArm"><rect x="70" y="170" width="44" height="150" rx="22" fill="#FFFFFF"/><circle cx="92" cy="325" r="24" fill="#C98A5E"/></g>
    <rect x="-114" y="170" width="44" height="150" rx="22" fill="#FFFFFF"/><circle cx="-92" cy="325" r="24" fill="#C98A5E"/>
    <rect x="-22" y="120" width="44" height="40" fill="#C98A5E"/>
    <ellipse cx="0" cy="60" rx="86" ry="96" fill="#C98A5E"/>
    <path d="M-86 40 Q -80 -50 0 -40 Q 80 -50 86 40 Q 70 -10 0 -10 Q -70 -10 -86 40" fill="#D9D9D9"/>
    <g id="vasuEyes"><ellipse cx="-30" cy="50" rx="10" ry="13" fill="#2B1D12"/><ellipse cx="30" cy="50" rx="10" ry="13" fill="#2B1D12"/></g>
    <path d="M-52 22 q 20 -12 40 -2 M12 20 q 20 -10 40 2" stroke="#9A9A9A" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M-42 100 Q 0 80 42 100 Q 20 112 0 104 Q -20 112 -42 100" fill="#CFCFCF"/>
    <path id="vasuMouth" d="M-14 122 Q 0 132 14 122" stroke="#5A2E1E" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="-86" cy="64" rx="12" ry="20" fill="#B97D52"/><ellipse cx="86" cy="64" rx="12" ry="20" fill="#B97D52"/>
  </g>

  <!-- Manu (young, checked shirt, jeans, phone) -->
  <g id="manu" transform="translate(720 1150)">
    <ellipse cx="0" cy="590" rx="120" ry="18" fill="rgba(0,0,0,.18)"/>
    <rect x="-62" y="350" width="56" height="240" rx="20" fill="#2F4A7A"/><rect x="6" y="350" width="56" height="240" rx="20" fill="#2F4A7A"/>
    <rect x="-66" y="575" width="64" height="22" rx="10" fill="#EDEDED"/><rect x="2" y="575" width="64" height="22" rx="10" fill="#EDEDED"/>
    <rect x="-95" y="150" width="190" height="220" rx="50" fill="#D2483A"/>
    <path d="M-95 200 H95 M-95 260 H95 M-95 320 H95 M-40 150 V370 M40 150 V370" stroke="#A8352A" stroke-width="10" opacity=".55"/>
    <rect x="-30" y="150" width="60" height="220" fill="#F4F4F4"/>
    <rect x="-118" y="175" width="44" height="160" rx="22" fill="#D2483A"/><circle cx="-96" cy="340" r="24" fill="#D9A07A"/>
    <g id="manuArm" transform="rotate(0 96 180)">
      <rect x="74" y="175" width="44" height="150" rx="22" fill="#D2483A"/><circle cx="96" cy="325" r="24" fill="#D9A07A"/>
      <g id="phone" transform="translate(70 230)"><rect x="0" y="0" width="56" height="96" rx="12" fill="#1C1410"/><rect x="6" y="10" width="44" height="74" rx="6" fill="#16C98A"/></g>
    </g>
    <rect x="-22" y="120" width="44" height="40" fill="#D9A07A"/>
    <ellipse cx="0" cy="60" rx="86" ry="96" fill="#D9A07A"/>
    <path d="M-90 40 Q -96 -70 0 -66 Q 96 -70 90 40 Q 84 -20 40 -24 Q 0 -10 -40 -24 Q -84 -20 -90 40" fill="#2B1D12"/>
    <path d="M-60 104 Q 0 170 60 104 Q 60 150 0 160 Q -60 150 -60 104" fill="#2B1D12"/>
    <g id="manuEyes"><ellipse cx="-30" cy="50" rx="10" ry="13" fill="#2B1D12"/><ellipse cx="30" cy="50" rx="10" ry="13" fill="#2B1D12"/></g>
    <path d="M-52 24 q 20 -10 40 0 M12 24 q 20 -10 40 0" stroke="#2B1D12" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path id="manuMouth" d="M-22 110 Q 0 128 22 110" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="-86" cy="64" rx="12" ry="20" fill="#C98A5E"/><ellipse cx="86" cy="64" rx="12" ry="20" fill="#C98A5E"/>
  </g>
</svg>

<div class="badge"><div class="handle"><img src="../../public/email-logo.png" alt="">@moneyplant.online</div><div class="ep">EP 01</div></div>
<div class="title" id="title">Salary വന്നു!</div>
<div class="notif" id="notif"><div class="ic">₹</div><div><b>Bank · just now</b><span>₹45,000 credited</span></div></div>
<div class="bubble" id="b1" style="left:560px; top:985px">ഇന്ന് party ആണ്!</div>
<div class="bubble" id="b2" style="left:110px; top:1000px">ആദ്യം ബില്ലുകൾ, മോനേ!</div>
<div class="sub" id="sub">Salary വന്ന ദിവസം…</div>
</div>

<script src="reel-kit.js"></script>
<script>
  const DURATION = 8
  const set = (id, attr, v) => document.getElementById(id).setAttribute(attr, v)
  function pop(el, t, start, dur = .35) {
    const p = backOut(prog(t, start, dur)); el.style.opacity = prog(t, start, dur * .6); el.style.transform = `scale(${.4 + .6 * p})`
  }
  function render(t) {
    // idle bob + blinks
    const bob = n => Math.sin(t * 3 + n) * 4
    set('vasu', 'transform', `translate(250 ${1180 + bob(1)})`)
    set('manu', 'transform', `translate(720 ${1150 + bob(0)})`)
    const blink = (t % 3.1 < .12) ? .15 : 1, blink2 = ((t + 1.4) % 3.7 < .12) ? .15 : 1
    set('manuEyes', 'transform', `translate(0 ${50 * (1 - blink)}) scale(1 ${blink})`)
    set('vasuEyes', 'transform', `translate(0 ${50 * (1 - blink2)}) scale(1 ${blink2})`)
    // Manu raises the phone when the salary lands
    const raise = easeOut(prog(t, 1.0, .5)) - easeOut(prog(t, 5.6, .5))
    set('manuArm', 'transform', `rotate(${-70 * raise} 96 180)`)
    // talking mouths
    const manuTalk = t > 3.0 && t < 4.6, vasuTalk = t > 5.2 && t < 7.0
    set('manuMouth', 'd', manuTalk && Math.sin(t * 22) > 0 ? 'M-22 108 Q 0 140 22 108 Z' : 'M-22 110 Q 0 128 22 110')
    set('vasuMouth', 'd', vasuTalk && Math.sin(t * 20) > 0 ? 'M-14 118 Q 0 140 14 118 Z' : 'M-14 122 Q 0 132 14 122')
    // overlays
    pop($('title'), t, .2); pop($('notif'), t, 1.4)
    if (t > 4.8) $('notif').style.opacity = 1 - prog(t, 4.8, .3)
    pop($('b1'), t, 3.0); if (t > 4.9) $('b1').style.opacity = 1 - prog(t, 4.9, .25)
    pop($('b2'), t, 5.2)
    $('sub').style.opacity = prog(t, .6, .3)
  }
  boot(render, DURATION, [0.9, 2.2, 3.8, 6.2])
</script>
</body>
</html>
