<!doctype html>
<html lang="ml">
<head>
<meta charset="utf-8">
<title>Manu &amp; Maaman S2 — 3D look test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+Malayalam:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="s2.css">
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
</head>
<body>
<!--
  Season 2 look test, 8 s. Not an episode: it proves the 3D look before EP01 is built.
    0.0–2.2  establishing shot, slow dolly-in (24→30 mm); Manu shows the phone (real app recording)
    2.2–4.6  CUT · Manu close-up, talking (65 mm, shallow focus, Maaman soft behind)
    4.6–6.2  CUT · two-shot, rack focus Manu → Maaman as Maaman reacts
    6.2–8.0  CUT · Maaman close-up, talking, slow push-in
  Lines are EP01's hook (approved storyline), used here only to test bubbles and subtitles over 3D.
-->
<canvas id="gl"></canvas>
<div class="badge"><div class="handle"><img src="/public/email-logo.png" alt="">@moneyplant.online</div><div class="ep">S2 · LOOK TEST</div></div>
<div class="bubble" id="bubble"></div>
<div class="sub" id="sub"></div>

<script type="module">
import * as THREE from 'three'
import { buildManu, buildMaaman, buildHome, buildPhone, lightRoom, ramp } from './cast3d.js'
import { createStage, shotAt, recordingTexture, bootS2 } from './stage.js'

const live = !location.search.includes('render')
const stage = createStage({ canvas: document.getElementById('gl') })
const { scene, camera } = stage
const home = buildHome(); scene.add(home.root)
lightRoom(scene)
const manu = buildManu(), maaman = buildMaaman()
scene.add(manu.root, maaman.root)
// the real dashboard recording (demo account), not a mock-up
const rec = await recordingTexture('assets/app-dashboard-screen.webm', { live })
const phone = buildPhone(rec.tex, { h: .3 }); scene.add(phone.root)

const LINES = [
  { who: 'manu', a: 2.4, b: 4.5, ml: 'മാമാ, ഈ മാസം ശമ്പളം കിട്ടിയാൽ ആദ്യം പുതിയ ഫോൺ വാങ്ങട്ടെ?', en: 'Maaman, when my salary comes this month, can I buy a new phone first?' },
  { who: 'maaman', a: 6.3, b: 8.0, ml: 'വാങ്ങാം. പക്ഷേ അതിന് മുൻപ് ഒരു കാര്യം പഠിക്കണം!', en: 'You can. But first, there’s one thing to learn!' },
]
const MANU = [.62, .25], MAAMAN = [-.7, .2]
const v = new THREE.Vector3()
const head = p => { p.head.getWorldPosition(v); return v.toArray() }
let heads = {}

// the shot list: every camera move in the test
const SHOTS = [
  // A · establishing, slow dolly-in, deep focus
  { t: 0,   pos: [0, 1.2, 5.8],    look: [0, 1.3, -1],    lens: 26, focus: 'manuHead', aperture: .002 },
  { t: 2.2, pos: [.15, 1.45, 3.9], look: [.05, 1.42, 0],  lens: 30, focus: 'manuHead', aperture: .003 },
  // B · Manu medium close-up (65 mm), shallow focus, slow push-in
  { t: 2.2, cut: true, pos: [.17, 1.85, 3.2], look: 'manuFace', lens: 65, focus: 'manuHead', aperture: .03 },
  { t: 4.6, pos: [.2, 1.85, 2.95], look: 'manuFace', lens: 66, focus: 'manuHead', aperture: .03 },
  // C · two-shot, slow truck left, rack focus Manu (near) → Maaman (far)
  { t: 4.6, cut: true, pos: [1.95, 1.62, 3.05], look: [-.05, 1.6, .2], lens: 36, focus: 'manuHead', aperture: .04 },
  { t: 6.2, pos: [1.7, 1.62, 2.95], look: [-.1, 1.62, .2], lens: 37, focus: 'maamanHead', aperture: .04, rack: [.4, .7] },
  // D · Maaman medium close-up, push-in
  { t: 6.2, cut: true, pos: [-.1, 1.9, 3.15], look: 'maamanFace', lens: 65, focus: 'maamanHead', aperture: .03 },
  { t: 8.0, pos: [-.13, 1.9, 2.88], look: 'maamanFace', lens: 67, focus: 'maamanHead', aperture: .03 },
]
const resolve = name => ({
  manuHead: heads.manu, maamanHead: heads.maaman,
  // aim a touch above the head so it sits just below centre, leaving the top for the bubble
  manuFace: [heads.manu[0], heads.manu[1] + .06, heads.manu[2]],
  maamanFace: [heads.maaman[0], heads.maaman[1] + .06, heads.maaman[2]],
})[name]

// close-ups carry the English subtitle only: the face shows who speaks, the voice carries the Malayalam
const CLOSE_UPS = [[2.2, 4.6], [6.2, 8.0]]
const bubble = document.getElementById('bubble'), sub = document.getElementById('sub')
const during = (t, a, b) => t >= a && t < b
const talking = (who, t) => LINES.some(l => l.who === who && during(t, l.a + .05, l.b - .15))

async function render(t) {
  home.animate(t)
  const phoneUp = ramp(t, .25, .45) * (1 - ramp(t, 4.4, .5))
  manu.pose(t, {
    x: MANU[0], z: MANU[1], turn: -.3,
    mood: t < 4.6 ? 'excited' : t < 5.2 ? 'grin' : t < 6.4 ? 'smile' : 'surprised',
    talking: talking('manu', t),
    jump: during(t, .55, 1.15) ? Math.sin((t - .55) / .6 * Math.PI) * .12 : 0,
    look: t < 2.2 ? [0, 0] : [-.45, 0], headTurn: t < 2.2 ? 0 : -.18,
    armR: { raise: .2 + .85 * phoneUp, elbow: .2 + 1.15 * phoneUp, out: .08 },
    armL: { raise: talking('manu', t) ? .35 + .1 * Math.sin(t * 5) : .05, elbow: talking('manu', t) ? .9 : .15, out: .12 },
  })
  maaman.pose(t, {
    x: MAAMAN[0], z: MAAMAN[1], turn: .35,
    mood: t < 4.9 ? 'amused' : t < 6.3 ? 'knowing' : 'smile',
    talking: talking('maaman', t), look: [.45, 0], headTurn: t > 5.0 ? .1 : 0,
    nod: during(t, 5.3, 6.1) ? Math.sin((t - 5.3) / .8 * Math.PI * 2) * .06 : 0,
    armR: { raise: ramp(t, 6.4, .4) * .55, elbow: .2 + ramp(t, 6.4, .4) * .75, out: .15 + ramp(t, 6.4, .4) * .25 },
  })
  heads = { manu: head(manu), maaman: head(maaman) }
  stage.frame(shotAt(SHOTS, t, resolve))  // camera first: the phone aims at this frame's camera

  // the phone stays in Manu's hand; screen turned to camera while he shows it
  manu.armR.hand.getWorldPosition(v)
  phone.root.position.copy(v).add(new THREE.Vector3(0, .1, .05))
  phone.root.lookAt(camera.position.x * .7, camera.position.y, camera.position.z)
  phone.root.visible = true
  await rec.seek((t * .7) % rec.duration)

  stage.render()

  // dialogue: Malayalam bubble with its tail on the speaker, English subtitle
  const L = LINES.find(l => during(t, l.a, l.b))
  if (L) {
    const fade = Math.min(1, (t - L.a) / .2, (L.b - t) / .2)
    bubble.textContent = L.ml; sub.textContent = L.en
    bubble.style.opacity = CLOSE_UPS.some(([a, b]) => during(t, a, b)) ? 0 : fade; sub.style.opacity = fade
    const p = stage.project(new THREE.Vector3(...heads[L.who]))
    const w = bubble.offsetWidth, left = Math.min(1080 - 50 - w, Math.max(50, p.x - w / 2))
    bubble.style.left = left + 'px'; bubble.style.setProperty('--tail', Math.min(w - 60, Math.max(60, p.x - left)) + 'px')
  } else { bubble.style.opacity = 0; sub.style.opacity = 0 }
}

window.REEL_OUT_DIR = 'manu-maaman/s2/looktest'
window.REEL_SFX = [{ t: .3, kind: 'whoosh' }, { t: .7, kind: 'chime' }, { t: 4.6, kind: 'whoosh' }, { t: 6.2, kind: 'whoosh' }]
bootS2(stage, render, 8, [.4, 1.2, 2.1, 3.0, 4.2, 4.8, 5.5, 6.1, 7.0, 7.8])
</script>
</body>
</html>
