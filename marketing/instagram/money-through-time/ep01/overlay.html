<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Money Through Time S01 EP01 — overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* The layer that sits on the Flow footage. Rendered transparent by overlay-render.mjs and laid
     over the clips by ffmpeg — the footage itself never passes through the browser.
     Safe areas: the top ~250 px and bottom ~420 px sit under Instagram's own UI. */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  body.preview { background: #5a5048; }   /* ?preview: stills on a neutral ground */
  body { font-family: 'Plus Jakarta Sans', sans-serif; color: #fff; }
  .shade { text-shadow: 0 2px 4px rgba(0,0,0,.55), 0 0 24px rgba(0,0,0,.35); }

  .card { position: absolute; left: 80px; top: 290px; opacity: 0; }
  .card .rule { width: 64px; height: 3px; background: #E8C77A; margin-bottom: 18px; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
  .card .title { font-size: 40px; font-weight: 700; letter-spacing: 1px; }
  .card .sub { font-size: 30px; font-weight: 600; letter-spacing: 3px; color: #F1E3C2; margin-top: 8px; }

  .tag { position: absolute; left: 80px; top: 450px; font-size: 22px; font-weight: 600; letter-spacing: 2px;
    text-transform: uppercase; color: rgba(255,255,255,.88); background: rgba(20,14,10,.42); padding: 8px 16px; border-radius: 8px; }

  .sub-line { position: absolute; left: 90px; right: 90px; bottom: 440px; text-align: center; font-size: 46px;
    line-height: 1.3; font-weight: 600; opacity: 0; }
</style>
</head>
<body>
<div class="card shade" id="card"><div class="rule"></div><div class="title" id="cardTitle"></div><div class="sub" id="cardSub"></div></div>
<div class="tag" id="tag"></div>
<div class="sub-line shade" id="sub"></div>
<script>
// window.EP is injected by overlay-render.mjs: shots.json + duration. Times are episode times.
const EP = window.EP ?? { tag: 'Dramatised reconstruction', duration: 7, lines: [{ a: .8, b: 6.4, en: 'Subtitle preview' }],
  cards: [{ a: .3, b: 5.2, title: 'Uruk · Southern Mesopotamia', sub: 'c. 3200 BCE' }] }
if (location.search.includes('preview')) document.body.classList.add('preview')
const $ = id => document.getElementById(id)
const fade = (t, a, b, d) => Math.max(0, Math.min(1, (t - a) / d, (b - t) / d))
$('tag').textContent = EP.tag

window.render = t => {
  const card = EP.cards.find(c => t >= c.a && t <= c.b)
  $('card').style.opacity = card ? fade(t, card.a, card.b, .5) : 0
  if (card) { $('cardTitle').textContent = card.title; $('cardSub').textContent = card.sub ?? ''; $('card').style.transform = `translateY(${(1 - fade(t, card.a, card.b, .5)) * 10}px)` }
  const line = EP.lines.find(l => t >= l.a && t <= l.b)
  $('sub').style.opacity = line ? fade(t, line.a, line.b, .2) : 0
  if (line) $('sub').textContent = line.en
  $('tag').style.opacity = fade(t, 0, EP.duration, .4)
}
window.REEL_DURATION = EP.duration
window.REEL_STILLS = [1, 3.5, 6]
window.render(0)
</script>
</body>
</html>
